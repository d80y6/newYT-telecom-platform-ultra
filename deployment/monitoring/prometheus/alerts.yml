groups:
  - name: bss-oss-alerts
    rules:
      # Service Availability
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute."

      # High Error Rate
      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.instance }}"
          description: "Error rate is above 5% for the last 5 minutes."

      # High Latency
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency on {{ $labels.instance }}"
          description: "95th percentile latency is above 1 second."

      # Rating Engine Latency (Critical)
      - alert: RatingEngineSlowResponse
        expr: histogram_quantile(0.95, rate(rating_duration_seconds_bucket[5m])) > 0.1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Rating engine latency exceeded 100ms"
          description: "Rating engine 95th percentile latency is {{ $value }}s, exceeding 100ms target."

      # Database Connection Pool
      - alert: DatabaseConnectionPoolExhausted
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database connection pool nearly exhausted"
          description: "Connection pool usage is above 90%."

      # Kafka Consumer Lag
      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag_sum > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag is high"
          description: "Consumer group {{ $labels.group }} has {{ $value }} messages lag."

      # Redis Memory
      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage is above 90%."

      # Disk Space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space is running low"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."

      # Billing Failures
      - alert: BillingProcessingFailures
        expr: rate(billing_processing_failures_total[5m]) > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High billing processing failure rate"
          description: "More than 10 billing failures per minute."

      # Order Processing Failures
      - alert: OrderProcessingFailures
        expr: rate(order_processing_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Order processing failures detected"
          description: "More than 5 order failures per minute."
