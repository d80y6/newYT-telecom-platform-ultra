_format_version: "3.0"
services:
- name: bss-core
  url: http://bss-core:8080/api/v1
  routes:
  - name: api-v1
    paths:
      - "/api/v1"
  plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - PATCH
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - "*"
      exposed_headers:
        - X-Total-Count
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      minute: 60000
      hour: 3600000
      policy: local
      hide_client_headers: false
      fault_tolerant: true
  - name: rate-limiting
    config:
      minute: 60000
      hour: 3600000
      policy: local
      hide_client_headers: false
      fault_tolerant: true
      limit_by: consumer
      consumer_match_none: true

- name: prometheus
  url: http://bss-prometheus:9090
  routes:
  - name: prometheus-route
    paths: ["/prometheus"]

- name: grafana
  url: http://bss-grafana:3000
  routes:
  - name: grafana-route
    paths: ["/grafana"]

- name: kibana
  url: http://bss-kibana:5601
  routes:
  - name: kibana-route
    paths: ["/kibana"]