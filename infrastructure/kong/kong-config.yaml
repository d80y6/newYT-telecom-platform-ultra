# Kong API Gateway Configuration
# OAuth2, rate limiting 10K req/sec

apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limiting
  namespace: bss-oss
plugin: rate-limiting
config:
  minute: 10000
  policy: redis
  redis_host: redis-cluster
  redis_port: 6379
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: oauth2
  namespace: bss-oss
plugin: oauth2
config:
  scopes:
    - tmf:read
    - tmf:write
    - tmf:admin
  mandatory_scope: true
  token_expiration: 3600
---
apiVersion: configuration.konghq.com/v1
kind: KongIngress
metadata:
  name: bss-api-ingress
  namespace: bss-oss
route:
  strip_path: false
upstream:
  hash_on: consumer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kong-ingress
  namespace: bss-oss
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/plugins: rate-limiting,oauth2
spec:
  rules:
    - host: api.yemenptc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
