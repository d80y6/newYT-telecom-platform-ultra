apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: bss-oss
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: yemenptc-bss
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: yemenptc/api-gateway:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PARTY_SERVICE_URL
              value: "http://bss-core:8080/api/v1"
            - name: CATALOG_SERVICE_URL
              value: "http://bss-core:8080/api/v1"
            - name: ORDER_SERVICE_URL
              value: "http://bss-core:8080/api/v1"
            - name: CHARGING_ENGINE_URL
              value: "http://charging-engine:8081"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api-docs
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: bss-oss
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-gateway-ingress
  namespace: bss-oss
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: api.yemenptc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
