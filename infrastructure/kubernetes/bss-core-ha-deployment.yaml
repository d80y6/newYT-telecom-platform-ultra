apiVersion: apps/v1
kind: Deployment
metadata:
  name: bss-core-zone-a
  namespace: bss-oss
  labels:
    app: bss-core
    zone: a
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bss-core
      zone: a
  template:
    metadata:
      labels:
        app: bss-core
        zone: a
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - bss-core
                topologyKey: topology.kubernetes.io/zone
      containers:
        - name: bss-core
          image: yemenptc/bss-core:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: bss-secrets
                  key: database-url
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-cluster"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
