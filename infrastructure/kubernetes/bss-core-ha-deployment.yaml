---
apiVersion: v1
kind: Service
metadata:
  name: bss-core-lb
  namespace: bss-oss
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: bss-core
  ports:
    - port: 80
      targetPort: 8080
      name: http
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bss-core-config
  namespace: bss-oss
data:
  application.yml: |
    spring:
      datasource:
        hikari:
          maximum-pool-size: 50
          minimum-idle: 10
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        pool-name: BSS-Core-Pool
        register-mbeans: true
      redis:
        cluster:
          nodes: redis-0:6379,redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379
      kafka:
        producer:
          acks: all
          retries: 3
          properties:
            enable.idempotence: true
        consumer:
          auto-offset-reset: earliest
          isolation.level: read_committed
    bss:
      ha:
        enabled: true
        zone-awareness: true
        session-replication: true
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bss-core-pdb
  namespace: bss-oss
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: bss-core
