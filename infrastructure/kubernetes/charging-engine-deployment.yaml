apiVersion: apps/v1
kind: Deployment
metadata:
  name: charging-engine
  namespace: bss-oss
  labels:
    app: charging-engine
    app.kubernetes.io/part-of: yemenptc-bss
spec:
  replicas: 3
  selector:
    matchLabels:
      app: charging-engine
  template:
    metadata:
      labels:
        app: charging-engine
    spec:
      containers:
        - name: charging-engine
          image: yemenptc/charging-engine:latest
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: PORT
              value: "8081"
            - name: REDIS_ADDR
              value: "redis-cluster:6379"
            - name: KAFKA_BROKERS
              value: "kafka-cluster-kafka-bootstrap:9092"
            - name: KAFKA_GROUP_ID
              value: "charging-engine-group"
          resources:
            requests:
              memory: "256Mi"
              cpu: "500m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: charging-engine
  namespace: bss-oss
spec:
  selector:
    app: charging-engine
  ports:
    - port: 8081
      targetPort: 8081
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: charging-engine-hpa
  namespace: bss-oss
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: charging-engine
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
