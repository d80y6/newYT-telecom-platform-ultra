# ============================================================================
# Citus PostgreSQL Sharded Cluster Configuration
# ============================================================================

global:
  storageClass: "standard"
  postgresql:
    username: "bss_admin"
    database: "bss_oss"
    existingSecret: ""

# Coordinator Node Configuration
coordinator:
  replicas: 2
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  service:
    type: ClusterIP
    port: 5432
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - coordinator
            topologyKey: kubernetes.io/hostname

# Worker Node Configuration
workers:
  count: 3
  shardsPerWorker: 32
  resources:
    requests:
      memory: "4Gi"
      cpu: "2000m"
    limits:
      memory: "8Gi"
      cpu: "4000m"
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
    accessModes:
      - ReadWriteOnce
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - worker
          topologyKey: kubernetes.io/hostname

# Citus Configuration
citus:
  shardReplicationFactor: 2
  shardCount: 96
  coordinatorAffinity:
    toWorker: true
  # Shard distribution strategy
  shardPlacement: "round-robin"  # round-robin, random
  # Connection pooling
  maxConnections: 500
  sharedBuffers: "2GB"
  effectiveCacheSize: "6GB"
  maintenanceWorkMem: "512MB"
  workMem: "128MB"

# High Availability
ha:
  enabled: true
  # Patroni for automatic failover
  patroni:
    enabled: true
    ttl: 30
    loopWait: 10
    retryTimeout: 10
    maximumLagOnFailover: 1048576
    masterStartTimeout: 300
    synchronousMode: false
    synchronousModeStrict: false
    postgresql:
      parameters:
        walLevel: replica
        hotStandby: "on"
        walKeepSize: 1GB
        maxWalSenders: 10
        maxReplicationSlots: 10
        walLogHints: "on"

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  prometheusExporter:
    enabled: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# Backup Configuration
backup:
  enabled: true
  schedule: "0 2 * * *"  # Daily at 2 AM
  retention: "30d"
  storage:
    enabled: true
    size: 500Gi
    storageClass: ""
  walArchiving:
    enabled: true
    compression: gzip
    archiveTimeout: 600

# Security
security:
  tls:
    enabled: false
    autoGenerated: false
    certificatesSecret: ""
    certFilename: "tls.crt"
    certKeyFilename: "tls.key"
    certCAFilename: "ca.crt"
  networkPolicy:
    enabled: true
    allowExternal: false

# Configuration scripts
initdbScripts:
  001-create-shards.sql: |
    -- Create shards for main tables
    SELECT create_distributed_table('customers', 'customer_id');
    SELECT create_distributed_table('subscriptions', 'customer_id');
    SELECT create_distributed_table('orders', 'customer_id');
    SELECT create_distributed_table('usage_records', 'customer_id');
    SELECT create_distributed_table('billing_records', 'customer_id');
    SELECT create_distributed_table('payments', 'customer_id');
    
    -- Reference tables (replicated on all nodes)
    SELECT create_reference_table('products');
    SELECT create_reference_table('services');
    SELECT create_reference_table('pricing_plans');
    SELECT create_reference_table('geographic_regions');

# Image Configuration
image:
  repository: citusdata/citus
  pullPolicy: IfNotPresent
  tag: "15.5"

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Namespace Configuration
namespace:
  create: false
  name: ""

# Override names
nameOverride: ""
fullnameOverride: ""
