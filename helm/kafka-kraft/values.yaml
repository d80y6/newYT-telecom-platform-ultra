# ============================================================================
# Kafka KRaft Mode Configuration (Zookeeper-less)
# ============================================================================

image:
  repository: bitnami/kafka
  tag: "3.6.1-debian-11-r0"
  pullPolicy: IfNotPresent

# KRaft Configuration - No Zookeeper Required!
kraft:
  enabled: true
  clusterId: "KRaftCluster01"  # Generate with: kafka-storage random-uuid
  
# Controller Nodes (Quorum voters)
controllers:
  replicaCount: 3
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  # Affinity for distributing controllers across nodes
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - controller
          topologyKey: kubernetes.io/hostname

# Broker Nodes
brokers:
  replicaCount: 3
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  # Affinity for distributing brokers across nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/component
                  operator: In
                  values:
                    - broker
            topologyKey: kubernetes.io/hostname

# Listeners Configuration
listeners:
  client:
    name: CLIENT
    port: 9092
    protocol: SASL_PLAINTEXT
    sslClientAuth: ""
  internal:
    name: INTERNAL
    port: 9093
    protocol: SASL_PLAINTEXT
    sslClientAuth: ""
  controller:
    name: CONTROLLER
    port: 9094
    protocol: SASL_SSL
    sslClientAuth: require

# Authentication
auth:
  enabled: true
  sasl:
    enabled: true
    mechanism: SCRAM-SHA-512
    interBrokerMechanism: SCRAM-SHA-512
  tls:
    enabled: false
    autoGenerated: false
    existingSecret: ""
    certFilename: ""
    certKeyFilename: ""
    caFilename: ""

# Topic Configuration
topics:
  autoCreate: true
  replicationFactor: 3
  minInSyncReplicas: 2
  defaultPartitions: 12
  
# Topic definitions for BSS/OSS
bssTopics:
  - name: bss.orders.created
    partitions: 24
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.orders.completed
    partitions: 24
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.customers.events
    partitions: 12
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.billing.charges
    partitions: 48
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.usage.records
    partitions: 48
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.payments.processed
    partitions: 24
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.notifications.email
    partitions: 12
    replicationFactor: 3
    minInSyncReplicas: 2
  - name: bss.notifications.sms
    partitions: 12
    replicationFactor: 3
    minInSyncReplicas: 2

# Retention Configuration
retention:
  hours: 168  # 7 days
  bytes: 107374182400  # 100GB
  checkIntervalMs: 300000

# Monitoring
metrics:
  enabled: true
  jmx:
    enabled: true
    port: 5555
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s
  kafkaExporter:
    enabled: true
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"

# JVM Configuration
heapOpts: "-Xmx2g -Xms2g"
jvmFlags: "-XX:+UseG1GC -XX:MaxGCPauseMillis=20"

# Logging
logLevel: INFO

# Security Context
securityContext:
  enabled: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001

# Service Account
serviceAccount:
  create: true
  automountServiceAccountToken: true

# Network Policy
networkPolicy:
  enabled: true
  allowExternal: false
