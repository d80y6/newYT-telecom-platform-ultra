    version: 1.0.0
    repository: file://../kafka-kraft
    condition: kafka-kraft.enabled
  - name: monitoring
    version: 1.0.0
    repository: file://../monitoring
    condition: monitoring.enabled
maintainers:
  - name: Yemen PTC BSS Team
    email: bss-team@yemenptc.com
