{{- if .Values.services.bss-core.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bss-core.fullname" . }}-bss-core
  labels:
    {{- include "bss-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: bss-core
spec:
  {{- if not .Values.services.bss-core.autoscaling.enabled }}
  replicas: {{ .Values.services.bss-core.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bss-core.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: bss-core
  template:
    metadata:
      labels:
        {{- include "bss-core.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: bss-core
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      serviceAccountName: {{ include "bss-core.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: bss-core
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.services.bss-core.image.repository }}:{{ .Values.services.bss-core.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.services.bss-core.service.port }}
              protocol: TCP
            - name: management
              containerPort: 9090
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "{{ .Values.global.environment }}"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ include "bss-core.fullname" . }}-citus-postgresql-coordinator:5432/bss_oss"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: citus-postgresql-credentials
                  key: username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: citus-postgresql-credentials
                  key: password
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "{{ include "bss-core.fullname" . }}-kafka-kraft:9092"
            - name: MANAGEMENT_SERVER_PORT
              value: "9090"
            - name: SERVER_PORT
              value: "{{ .Values.services.bss-core.service.port }}"
          resources:
            {{- toYaml .Values.services.bss-core.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bss-core.fullname" . }}-bss-core
  labels:
    {{- include "bss-core.labels" . | nindent 4 }}
    app.kubernetes.io/component: bss-core
spec:
  type: {{ .Values.services.bss-core.service.type }}
  ports:
    - port: {{ .Values.services.bss-core.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "bss-core.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: bss-core
---
{{- if .Values.services.bss-core.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "bss-core.fullname" . }}-bss-core-hpa
  labels:
    {{- include "bss-core.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "bss-core.fullname" . }}-bss-core
  minReplicas: {{ .Values.services.bss-core.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.services.bss-core.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.bss-core.autoscaling.targetCPUUtilizationPercentage }}
    {{- if .Values.services.bss-core.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.services.bss-core.autoscaling.targetMemoryUtilizationPercentage }}
    {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
{{- end }}
{{- end }}
