name: Load Tests

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:

jobs:
  load-test:
    name: Run Load Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D68
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run Party API load test
        run: |
          k6 run \
            --vus 100 \
            --duration 5m \
            --out json=results/party-api.json \
            tests/load/party-api.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Run Order API load test
        run: |
          k6 run \
            --vus 50 \
            --duration 5m \
            --out json=results/order-api.json \
            tests/load/order-api.js
        env:
          BASE_URL: ${{ secrets.STAGING_URL }}

      - name: Run Charging API load test
        run: |
          k6 run \
            --vus 200 \
            --duration 5m \
            --out json=results/charging-api.json \
            tests/load/charging-api.js
        env:
          CHARGING_URL: ${{ secrets.CHARGING_URL }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: results/
