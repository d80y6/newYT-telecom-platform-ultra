# ============================================================================
# YEMEN PTC BSS/OSS PLATFORM - GITLAB CI/CD PIPELINE
# ============================================================================

stages:
  - build
  - test
  - security
  - quality
  - deploy-dev
  - deploy-staging
  - deploy-prod

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  JAVA_VERSION: "21"

cache:
  paths:
    - .m2/repository/

# ============ BUILD STAGE ============

build:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests -Pproduction
  artifacts:
    paths:
      - "*/target/*.jar"
    expire_in: 1 hour
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

docker-build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -f deployment/Dockerfile .
    - docker push $IMAGE_TAG
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ============ TEST STAGE ============

unit-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn test -Ptest
  artifacts:
    reports:
      junit:
        - "*/target/surefire-reports/TEST-*.xml"
    when: always
  coverage: '/Total.*?([0-9]{1,3})%/'
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

integration-tests:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  services:
    - postgres:15-alpine
    - redis:7-alpine
    - confluentinc/cp-kafka:7.5.0
  variables:
    POSTGRES_DB: bss_oss_test
    POSTGRES_USER: bss_admin
    POSTGRES_PASSWORD: bss_password
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bss_oss_test
    SPRING_REDIS_HOST: redis
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  script:
    - mvn verify -Pintegration-test
  artifacts:
    reports:
      junit:
        - "*/target/failsafe-reports/TEST-*.xml"
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ============ SECURITY STAGE ============

security-scan:
  stage: security
  image: owasp/zap2docker-stable
  script:
    - mkdir -p /zap/wrk
    - zap-baseline.py -t http://bss-core:8080 -r zap-report.html || true
  artifacts:
    paths:
      - zap-report.html
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

dependency-check:
  stage: security
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn org.owasp:dependency-check-maven:check
  artifacts:
    paths:
      - "*/target/dependency-check-report.html"
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ============ QUALITY STAGE ============

sonar-analysis:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn sonar:sonar -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "main"

code-coverage:
  stage: quality
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn jacoco:report
    - cat target/site/jacoco/index.html | grep -oP 'Total[^<]*?[0-9]{1,3}%' || echo "Coverage report generated"
  artifacts:
    paths:
      - "*/target/site/jacoco/"
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"

# ============ DEPLOY STAGES ============

deploy-dev:
  stage: deploy-dev
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context dev
    - kubectl apply -f deployment/kubernetes/
    - kubectl set image deployment/bss-core bss-core=$IMAGE_TAG -n bss-oss
    - kubectl rollout status deployment/bss-core -n bss-oss
  environment:
    name: development
    url: http://dev.bss.yemen-telecom.ye
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

deploy-staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context staging
    - kubectl apply -f deployment/kubernetes/
    - kubectl set image deployment/bss-core bss-core=$IMAGE_TAG -n bss-oss
    - kubectl rollout status deployment/bss-core -n bss-oss
  environment:
    name: staging
    url: http://staging.bss.yemen-telecom.ye
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual

deploy-prod:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  script:
    - kubectl config use-context production
    - kubectl apply -f deployment/kubernetes/
    - kubectl set image deployment/bss-core bss-core=$IMAGE_TAG -n bss-oss
    - kubectl rollout status deployment/bss-core -n bss-oss
  environment:
    name: production
    url: http://bss.yemen-telecom.ye
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - when: manual
