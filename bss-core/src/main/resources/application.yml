spring:
  application:
    name: bss-core
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bss_oss}
    username: ${SPRING_DATASOURCE_USERNAME:bss_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme_prod_password_here}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: bss-core-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.yemenptc.*"
  billing:
    tax-rate: ${BILLING_TAX_RATE:0.05}
    default-currency: ${BILLING_DEFAULT_CURRENCY:YER}
    invoice-due-days: ${BILLING_INVOICE_DUE_DAYS:30}
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      timeout: 2000
    elasticsearch:
      repositories:
        enabled: ${ELASTICSEARCH_ENABLED:true}
    neo4j:
      repositories:
        enabled: ${NEO4J_ENABLED:false}
      uri: ${SPRING_DATA_NEO4J_URI:bolt://localhost:7687}
    mongodb:
      repositories:
        enabled: ${MONGODB_ENABLED:false}
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: 27017
  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    baseline-version: 1
    sql-migration-prefix: V
    sql-migration-separator: _
    sql-migration-suffixes: .sql
    clean-disabled: true
  web:
    cors:
      allowed-origin-patterns: "*"
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: "*"
      exposed-headers: "*"

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1
ssl:
    enabled: ${SSL_ENABLED:true}
    key-store: ${SSL_KEYSTORE:classpath:keystore.p12}
    key-store-password: ${SSL_KEYSTORE_PASSWORD:changeme_keystore_password_here}
    key-store-type: PKCS12
    key-alias: ${SSL_KEY_ALIAS:bss-core}
    enabled-protocols: TLSv1.3
    protocol: TLS
    ciphers: TLS_AES_256_GCM_SHA256,TLS_CHACHA20_POLY1305_SHA256,TLS_AES_128_GCM_SHA256
  http2:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,loggers
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
        step: 1m
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms
  health:
    circuitbreakers:
      enabled: true
    mongo:
      enabled: false
    neo4j:
      enabled: false
    redis:
      enabled: true
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.yemenptc: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

keycloak:
  realm: yemenptc-bss
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://keycloak:8080/}
  resource: bss-core
  public-client: false
  ssl-required: external
  bearer-only: false
  enable-cors: true
  cors-allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
  use-resource-role-mappings: false
  principal-attribute: preferred_username
  token-store: session
  connection-pool-size: 20
  credentials:
    secret: ${KEYCLOAK_CLIENT_SECRET:}
  realm-public-key: ${KEYCLOAK_REALM_PUBLIC_KEY:}

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        ignoreExceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
        recordExceptions:
          - java.io.IOException
          - java.sql.SQLException
          - org.springframework.dao.DataAccessException
      resilient:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 40
        waitDurationInOpenState: 60s
    instances:
      orderService:
        baseConfig: default
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
      billingService:
        baseConfig: default
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
      provisioningService:
        baseConfig: default
        registerHealthIndicator: true
        slidingWindowSize: 10
        failureRateThreshold: 50
      ratingService:
        baseConfig: default
        registerHealthIndicator: true
        slidingWindowSize: 20
        failureRateThreshold: 30
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.ResourceAccessException
    instances:
      orderService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 1s
      billingService:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 1s
      provisioningService:
        baseConfig: default
        maxAttempts: 2
        waitDuration: 500ms
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 100
        maxWaitDuration: 10s
    instances:
      orderService:
        baseConfig: default
        maxConcurrentCalls: 50
      billingService:
        baseConfig: default
        maxConcurrentCalls: 50
      provisioningService:
        baseConfig: default
        maxConcurrentCalls: 30
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s
        cancelRunningFuture: true
    instances:
      orderService:
        baseConfig: default
        timeoutDuration: 5s
      billingService:
        baseConfig: default
        timeoutDuration: 5s
      ratingService:
        baseConfig: default
        timeoutDuration: 2s
  ratelimiter:
    configs:
      default:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      strict:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 1s
      public:
        limitForPeriod: 30
        limitRefreshPeriod: 1s
        timeoutDuration: 0
      authenticated:
        limitForPeriod: 100
        limitRefreshPeriod: 1s
        timeoutDuration: 0
    instances:
      apiGateway:
        baseConfig: default
        limitForPeriod: 50
      externalApi:
        baseConfig: strict
        limitForPeriod: 10
      customerApi:
        baseConfig: authenticated
        limitForPeriod: 60
      productApi:
        baseConfig: authenticated
        limitForPeriod: 40
      billingApi:
        baseConfig: strict
        limitForPeriod: 20
      adminApi:
        baseConfig: authenticated
        limitForPeriod: 200

api:
  security:
    rate-limiting:
      enabled: true
      global-limit: 1000
      per-endpoint-limit: 100
      burst-capacity: 50
      replenish-rate: 10
    request-size:
      max-size: 10MB
    headers:
      x-frame-options: DENY
      x-content-type-options: nosniff
      x-xss-protection: 1; mode=block
      content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';"
    cors:
      allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      allowed-headers: Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
      exposed-headers: Location
      allow-credentials: true
      max-age: 3600
