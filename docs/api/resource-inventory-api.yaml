openapi: 3.0.3
info:
  title: Resource Inventory Management API
  description: |
    TMF638-compliant Resource Inventory Management API for Yemen PTC.
    Manages network resources (physical, logical, virtual) including SIM cards, phone numbers,
    IP addresses, network ports, cables, and OLT equipment.
  version: 1.0.0
  contact:
    name: Yemen PTC API Support
    email: api-support@yemen-telecom.ye

servers:
  - url: http://api-gateway:8080/api/v1
    description: Production API Gateway
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Resources
    description: Resource lifecycle management
  - name: Resource Specifications
    description: Resource specification management
  - name: Resource Categories
    description: Resource classification
  - name: Resource Pools
    description: Resource pool and reservation management
  - name: Resource Relationships
    description: Resource topology and relationships

paths:
  /resourceInventory/v4/resource:
    get:
      tags: [Resources]
      summary: List all resources
      operationId: listResources
      parameters:
        - name: resourceType
          in: query
          required: false
          schema:
            type: string
            enum: [SIM_CARD, PHONE_NUMBER, MODEM, SET_TOP_BOX, FIBER_LINE, COPPER_LINE, IP_ADDRESS, VLAN, OLT_PORT, PON_PORT, ROUTER_PORT]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [AVAILABLE, RESERVED, ALLOCATED, ACTIVE, INACTIVE, MAINTENANCE, DECOMMISSIONED]
        - name: resourcePool
          in: query
          required: false
          schema:
            type: string
        - name: place
          in: query
          required: false
          schema:
            type: string
            description: Geographic location or site
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Resources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'
    post:
      tags: [Resources]
      summary: Create a new resource
      operationId: createResource
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceCreate'
      responses:
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'

  /resourceInventory/v4/resource/{id}:
    get:
      tags: [Resources]
      summary: Get resource by ID
      operationId: getResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: fields
          in: query
          schema:
            type: string
            description: Comma-separated field list
      responses:
        '200':
          description: Resource retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '404':
          description: Resource not found
    patch:
      tags: [Resources]
      summary: Update resource
      operationId: updateResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceUpdate'
      responses:
        '200':
          description: Resource updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
    delete:
      tags: [Resources]
      summary: Decommission resource
      operationId: decommissionResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Resource decommissioned successfully

  /resourceInventory/v4/resource/{id}/status:
    patch:
      tags: [Resources]
      summary: Update resource status
      operationId: updateResourceStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceStatusUpdate'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'

  /resourceInventory/v4/resource/{id}/characteristics:
    get:
      tags: [Resources]
      summary: Get resource characteristics
      operationId: getResourceCharacteristics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Characteristics retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Characteristic'
    patch:
      tags: [Resources]
      summary: Update resource characteristics
      operationId: updateResourceCharacteristics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Characteristic'
      responses:
        '200':
          description: Characteristics updated

  /resourceInventory/v4/resource/{id}/relationships:
    get:
      tags: [Resource Relationships]
      summary: Get resource relationships
      operationId: getResourceRelationships
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: relationshipType
          in: query
          schema:
            type: string
            enum: [CONTAINS, DEPENDS_ON, CONNECTS_TO, INSTALLED_AT, PART_OF]
      responses:
        '200':
          description: Relationships retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ResourceRelationship'
    post:
      tags: [Resource Relationships]
      summary: Create resource relationship
      operationId: createResourceRelationship
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceRelationshipCreate'
      responses:
        '201':
          description: Relationship created

  /resourceInventory/v4/resourceSpecification:
    get:
      tags: [Resource Specifications]
      summary: List resource specifications
      operationId: listResourceSpecifications
      responses:
        '200':
          description: Specifications retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceSpecificationList'
    post:
      tags: [Resource Specifications]
      summary: Create resource specification
      operationId: createResourceSpecification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSpecificationCreate'
      responses:
        '201':
          description: Specification created

  /resourceInventory/v4/resourcePool:
    get:
      tags: [Resource Pools]
      summary: List resource pools
      operationId: listResourcePools
      parameters:
        - name: poolType
          in: query
          schema:
            type: string
            enum: [PHONE_NUMBER, IP_ADDRESS, SIM_CARD, VLAN]
      responses:
        '200':
          description: Pools retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePoolList'
    post:
      tags: [Resource Pools]
      summary: Create resource pool
      operationId: createResourcePool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePoolCreate'
      responses:
        '201':
          description: Pool created

  /resourceInventory/v4/resourcePool/{id}/reserve:
    post:
      tags: [Resource Pools]
      summary: Reserve resources from pool
      operationId: reserveResources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceReservationRequest'
      responses:
        '200':
          description: Resources reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceReservationResponse'

  /resourceInventory/v4/resourcePool/{id}/release:
    post:
      tags: [Resource Pools]
      summary: Release reserved resources
      operationId: releaseResources
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceReleaseRequest'
      responses:
        '200':
          description: Resources released

  /resourceInventory/v4/search:
    post:
      tags: [Resources]
      summary: Search resources
      operationId: searchResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourceSearchRequest'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceList'

components:
  schemas:
    Resource:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        category:
          type: string
        description:
          type: string
        name:
          type: string
        resourceVersion:
          type: string
        resourceType:
          type: string
        resourceSpecification:
          $ref: '#/components/schemas/ResourceSpecificationRef'
        place:
          $ref: '#/components/schemas/PlaceRef'
        resourceStatus:
          type: string
          enum: [AVAILABLE, RESERVED, ALLOCATED, ACTIVE, INACTIVE, MAINTENANCE, DECOMMISSIONED]
        operationalState:
          type: string
          enum: [ENABLE, DISABLE]
        usageState:
          type: string
          enum: [IDLE, ACTIVE, BUSY]
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        resourceCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'
        resourceRelationship:
          type: array
          items:
            $ref: '#/components/schemas/ResourceRelationship'
        relatedParty:
          type: array
          items:
            $ref: '#/components/schemas/RelatedParty'
        activationFeature:
          type: array
          items:
            $ref: '#/components/schemas/Feature'
        startOperatingDate:
          type: string
          format: date-time
        endOperatingDate:
          type: string
          format: date-time
        baseType:
          type: string
        schemaLocation:
          type: string
        type:
          type: string
        validFor:
          $ref: '#/components/schemas/TimePeriod'

    ResourceCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
          enum: [SIM_CARD, PHONE_NUMBER, MODEM, SET_TOP_BOX, FIBER_LINE, COPPER_LINE, IP_ADDRESS, VLAN, OLT_PORT, PON_PORT, ROUTER_PORT]
        resourceSpecificationId:
          type: string
        placeId:
          type: string
        resourceCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicCreate'
        relatedParty:
          type: array
          items:
            $ref: '#/components/schemas/RelatedPartyCreate'

    ResourceUpdate:
      type: object
      properties:
        description:
          type: string
        resourceStatus:
          type: string
        operationalState:
          type: string
        placeId:
          type: string
        resourceCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'

    ResourceStatusUpdate:
      type: object
      properties:
        resourceStatus:
          type: string
          enum: [AVAILABLE, RESERVED, ALLOCATED, ACTIVE, INACTIVE, MAINTENANCE, DECOMMISSIONED]
        reason:
          type: string

    ResourceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ResourceSpecification:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        brand:
          type: string
        resourceType:
          type: string
        lifecycleStatus:
          type: string
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        resourceSpecCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicSpecification'
        resourceSpecRelationship:
          type: array
          items:
            $ref: '#/components/schemas/SpecificationRelationship'
        relatedParty:
          type: array
          items:
            $ref: '#/components/schemas/RelatedParty'
        attachment:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'

    ResourceSpecificationCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
        version:
          type: string
        resourceSpecCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicSpecification'

    ResourceSpecificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceSpecification'
        total:
          type: integer

    ResourceSpecificationRef:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        version:
          type: string

    ResourcePool:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [PHONE_NUMBER, IP_ADDRESS, SIM_CARD, VLAN]
        resourceSpecification:
          $ref: '#/components/schemas/ResourceSpecificationRef'
        place:
          $ref: '#/components/schemas/PlaceRef'
        capacity:
          type: object
          properties:
            total:
              type: integer
            available:
              type: integer
            reserved:
              type: integer
            allocated:
              type: integer
        validFor:
          $ref: '#/components/schemas/TimePeriod'

    ResourcePoolCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
        resourceSpecificationId:
          type: string
        placeId:
          type: string

    ResourcePoolList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourcePool'
        total:
          type: integer

    ResourceReservationRequest:
      type: object
      properties:
        quantity:
          type: integer
        relatedParty:
          $ref: '#/components/schemas/RelatedParty'
        validFor:
          $ref: '#/components/schemas/TimePeriod'

    ResourceReservationResponse:
      type: object
      properties:
        reservationId:
          type: string
        reservedResources:
          type: array
          items:
            $ref: '#/components/schemas/Resource'
        validUntil:
          type: string
          format: date-time

    ResourceReleaseRequest:
      type: object
      properties:
        reservationId:
          type: string
        resourceIds:
          type: array
          items:
            type: string

    ResourceRelationship:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        relationshipType:
          type: string
          enum: [CONTAINS, DEPENDS_ON, CONNECTS_TO, INSTALLED_AT, PART_OF]
        resource:
          $ref: '#/components/schemas/ResourceRef'

    ResourceRelationshipCreate:
      type: object
      properties:
        relationshipType:
          type: string
          enum: [CONTAINS, DEPENDS_ON, CONNECTS_TO, INSTALLED_AT, PART_OF]
        resourceId:
          type: string

    ResourceRef:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        resourceType:
          type: string

    Characteristic:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM, DATE, ARRAY]

    CharacteristicCreate:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueType:
          type: string

    CharacteristicSpecification:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        valueType:
          type: string
        configurable:
          type: boolean
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        charSpecRelationship:
          type: array
          items:
            $ref: '#/components/schemas/CharacteristicSpecificationRelationship'

    CharacteristicSpecificationRelationship:
      type: object
      properties:
        relationshipType:
          type: string
        characteristicSpecificationId:
          type: string

    SpecificationRelationship:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        relationshipType:
          type: string
        resourceSpecification:
          $ref: '#/components/schemas/ResourceSpecificationRef'

    PlaceRef:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        role:
          type: string

    RelatedParty:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        name:
          type: string
        role:
          type: string

    RelatedPartyCreate:
      type: object
      properties:
        id:
          type: string
        role:
          type: string

    Attachment:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        description:
          type: string
        attachmentType:
          type: string
        url:
          type: string
        mimeType:
          type: string

    Feature:
      type: object
      properties:
        id:
          type: string
        isEnabled:
          type: boolean
        name:
          type: string
        featureCharacteristic:
          type: array
          items:
            $ref: '#/components/schemas/Characteristic'

    TimePeriod:
      type: object
      properties:
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time

    ResourceSearchRequest:
      type: object
      properties:
        resourceType:
          type: string
        status:
          type: string
        placeId:
          type: string
        specificationId:
          type: string
        characteristics:
          type: object
          additionalProperties:
            type: string
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 20

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
