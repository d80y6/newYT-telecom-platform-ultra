          enum: [VOICE, DATA, IPTV, SMS, MMS, VOICE_OVER_LTE, FIXED_LINE, BROADBAND, ENTERPRISE_VPN]
        serviceAddress:
          $ref: '#/components/schemas/Address'
        bandwidth:
          type: string
        speedTier:
          type: string
        coverageArea:
          type: string

    ServiceDetailsCreate:
      type: object
      properties:
        serviceType:
          type: string
          enum: [VOICE, DATA, IPTV, SMS, MMS, VOICE_OVER_LTE, FIXED_LINE, BROADBAND, ENTERPRISE_VPN]
        serviceAddress:
          $ref: '#/components/schemas/AddressCreate'
        bandwidth:
          type: string
        speedTier:
          type: string

    ResourceDetails:
      type: object
      properties:
        resourceId:
          type: string
        resourceType:
          type: string
          enum: [SIM_CARD, PHONE_NUMBER, MODEM, SET_TOP_BOX, FIBER_LINE, CABLE, IP_ADDRESS, VLAN]
        serialNumber:
          type: string
        phoneNumber:
          type: string
        imsi:
          type: string
        msisdn:
          type: string
        macAddress:
          type: string
        status:
          type: string
          enum: [ALLOCATED, RESERVED, ACTIVE, INACTIVE, RETURNED]

    ResourceDetailsCreate:
      type: object
      properties:
        resourceType:
          type: string
          enum: [SIM_CARD, PHONE_NUMBER, MODEM, SET_TOP_BOX, FIBER_LINE, CABLE, IP_ADDRESS, VLAN]
        serialNumber:
          type: string
        phoneNumber:
          type: string
        imsi:
          type: string
        msisdn:
          type: string

    Address:
      type: object
      properties:
        id:
          type: string
        street:
          type: string
        city:
          type: string
        district:
          type: string
        governorate:
          type: string
        postalCode:
          type: string
        country:
          type: string
          default: Yemen
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double

    AddressCreate:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        district:
          type: string
        governorate:
          type: string
          enum: ['Sana''a', Aden, Taiz, Hudaydah, Hadramaut, Ibb, Dhamar, Amran, Marib, Al_Jawf, Sa''da, Hajjah, Al_Mahwit, Raymah, Dhamar, Al_Bayda, Shabwah, Lahij, Abyan, Al_Mahra, Socotra]
        postalCode:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
      required:
        - city
        - governorate

