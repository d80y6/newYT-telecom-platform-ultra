      type: object
      properties:
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time

    OrderValidationResult:
      type: object
      properties:
        orderId:
          type: string
        valid:
          type: boolean
        validationDate:
          type: string
          format: date-time
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/ValidationWarning'

    ValidationError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        itemId:
          type: string
          description: Related order item if applicable
        field:
          type: string
          description: Field that failed validation

    ValidationWarning:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        itemId:
          type: string

    ProcessOrderRequest:
      type: object
      properties:
        skipValidation:
          type: boolean
          default: false
        processDate:
          type: string
          format: date-time
          description: Scheduled processing date
        note:
          type: string

    OrderSearchRequest:
      type: object
      properties:
        orderType:
          type: array
          items:
            type: string
            enum: [ACQUISITION, MODIFICATION, TERMINATION, SUSPENSION, TRANSFER]
        state:
          type: array
          items:
            type: string
            enum: [ACKNOWLEDGED, IN_PROGRESS, COMPLETED, CANCELLED, FAILED, PENDING, REJECTED, HELD]
        priority:
          type: array
          items:
            type: string
            enum: [URGENT, HIGH, NORMAL, LOW]
        customerId:
          type: string
        customerName:
          type: string
        channel:
          type: string
        orderDateFrom:
          type: string
          format: date-time
        orderDateTo:
          type: string
          format: date-time
        completionDateFrom:
          type: string
          format: date-time
        completionDateTo:
          type: string
          format: date-time
        productOfferingId:
          type: string
        externalId:
          type: string
        billingAccountId:
          type: string
        keyword:
          type: string
          description: Free text search in description and notes
        page:
          type: integer
          default: 0
        size:
          type: integer
          default: 20
        sort:
          type: string
          description: Sort field and direction (e.g., orderDate:desc)

    OrderStats:
      type: object
      properties:
        period:
          $ref: '#/components/schemas/TimePeriod'
        totalOrders:
          type: integer
        byState:
          type: object
          additionalProperties:
            type: integer
        byType:
          type: object
          additionalProperties:
            type: integer
        byChannel:
          type: object
          additionalProperties:
            type: integer
        byPriority:
          type: object
          additionalProperties:
            type: integer
        averageCompletionTime:
          type: number
          description: Average completion time in hours
        completionRate:
          type: number
          description: Percentage of completed orders

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
              code:
                type: string
