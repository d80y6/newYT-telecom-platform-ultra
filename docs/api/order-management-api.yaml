          type: string

    ProductRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        href:
          type: string
        status:
          type: string

    RelatedParty:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [CUSTOMER, INITIATOR, SALESPERSON, TECHNICIAN, PARTNER]
        href:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string

    RelatedPartyCreate:
      type: object
      properties:
        id:
          type: string
        role:
          type: string
          enum: [CUSTOMER, INITIATOR, SALESPERSON, TECHNICIAN, PARTNER]
      required:
        - id
        - role

    ChannelRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        channelType:
          type: string
          enum: [RETAIL_STORE, CALL_CENTER, ONLINE_PORTAL, MOBILE_APP, USSD, PARTNER_API, FIELD_AGENT]

    BillingAccountRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        href:
          type: string

    PaymentRef:
      type: object
      properties:
        id:
          type: string
        paymentMethod:
          type: string
          enum: [CASH, CREDIT_CARD, BANK_TRANSFER, MOBILE_MONEY, INVOICE, PREPAID_BALANCE]
        amount:
          type: number
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, AUTHORIZED, CAPTURED, FAILED, REFUNDED]

    AppointmentRef:
      type: object
      properties:
        id:
          type: string
        href:
          type: string
        date:
          type: string
          format: date-time
        timeSlot:
          type: string
        technician:
          type: string

    Characteristic:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM, DATE]
        unitOfMeasure:
          type: string

    CharacteristicCreate:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM, DATE]
          default: STRING
        unitOfMeasure:
          type: string
      required:
        - name
        - value

    Note:
      type: object
      properties:
        id:
          type: string
        author:
          type: string
        date:
          type: string
          format: date-time
        text:
          type: string
        noteType:
          type: string
          enum: [GENERAL, TECHNICAL, BILLING, CUSTOMER_CONTACT, INTERNAL]

    NoteCreate:
      type: object
      properties:
        text:
          type: string
        noteType:
          type: string
          enum: [GENERAL, TECHNICAL, BILLING, CUSTOMER_CONTACT, INTERNAL]
          default: GENERAL
      required:
        - text

