          type: string
          enum: [ONE_TIME, RECURRING, USAGE]
        price:
          $ref: '#/components/schemas/Price'
        taxRate:
          type: number
        recurringChargePeriod:
          type: string
          enum: [MONTHLY, QUARTERLY, YEARLY]

    Price:
      type: object
      properties:
        amount:
