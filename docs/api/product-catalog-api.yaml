openapi: 3.0.3
info:
  title: Product Catalog Management API
  description: |
    TMF620-compliant Product Catalog Management API for Yemen PTC.
    Supports multi-play offerings (Fixed, Mobile, Internet, Enterprise).
  version: 1.0.0
  contact:
    name: Yemen PTC API Support
    email: api-support@yemen-telecom.ye

servers:
  - url: http://api-gateway:8080/api/v1
    description: Production API Gateway
  - url: http://localhost:8080/api/v1
    description: Local Development

tags:
  - name: Product Offerings
    description: Product offering management
  - name: Product Specifications
    description: Product specification management
  - name: Product Categories
    description: Product category management
  - name: Product Bundles
    description: Product bundle management
  - name: Pricing
    description: Pricing management

paths:
  /products:
    get:
      tags: [Product Offerings]
      summary: List all product offerings
      operationId: listProductOfferings
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
          description: Filter by category
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [ACTIVE, INACTIVE, DRAFT, RETIRED]
          description: Filter by status
        - name: serviceType
          in: query
          required: false
          schema:
            type: string
          description: Filter by service type
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 20
        - name: sort
          in: query
          required: false
          schema:
            type: string
          description: Sort field and direction (e.g., name:asc)
      responses:
        '200':
          description: Product offerings retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOfferingList'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Product Offerings]
      summary: Create a new product offering
      operationId: createProductOffering
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductOfferingCreate'
      responses:
        '201':
          description: Product offering created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOffering'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Product offering already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}:
    get:
      tags: [Product Offerings]
      summary: Get product offering by ID
      operationId: getProductOffering
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product offering retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOffering'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Product Offerings]
      summary: Update product offering
      operationId: updateProductOffering
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductOfferingUpdate'
      responses:
        '200':
          description: Product offering updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOffering'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Product Offerings]
      summary: Retire product offering
      operationId: retireProductOffering
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Product offering retired successfully
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/pricing:
    get:
      tags: [Pricing]
      summary: Get pricing for product offering
      operationId: getProductPricing
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Get pricing for specific date
      responses:
        '200':
          description: Pricing retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOfferingPriceList'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Pricing]
      summary: Add pricing to product offering
      operationId: addProductPricing
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductOfferingPriceCreate'
      responses:
        '201':
          description: Pricing added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductOfferingPrice'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/characteristics:
    get:
      tags: [Product Offerings]
      summary: Get product characteristics
      operationId: getProductCharacteristics
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Characteristics retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCharacteristicList'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Product Offerings]
      summary: Update product characteristics
      operationId: updateProductCharacteristics
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCharacteristicList'
      responses:
        '200':
          description: Characteristics updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCharacteristicList'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /products/{productId}/bundles:
    get:
      tags: [Product Bundles]
      summary: Get bundles containing this product
      operationId: getProductBundles
      parameters:
        - name: productId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bundles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBundleList'
        '404':
          description: Product offering not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /categories:
    get:
      tags: [Product Categories]
      summary: List all product categories
      operationId: listProductCategories
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
          description: Filter by parent category
        - name: depth
          in: query
          required: false
          schema:
            type: integer
          description: Limit tree depth
      responses:
        '200':
          description: Categories retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategoryList'
    post:
      tags: [Product Categories]
      summary: Create product category
      operationId: createProductCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategoryCreate'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'

  /categories/{categoryId}:
    get:
      tags: [Product Categories]
      summary: Get category by ID
      operationId: getProductCategory
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '404':
          description: Category not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /bundles:
    get:
      tags: [Product Bundles]
      summary: List all product bundles
      operationId: listProductBundles
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Bundles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBundleList'
    post:
      tags: [Product Bundles]
      summary: Create product bundle
      operationId: createProductBundle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductBundleCreate'
      responses:
        '201':
          description: Bundle created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBundle'

  /bundles/{bundleId}:
    get:
      tags: [Product Bundles]
      summary: Get bundle by ID
      operationId: getProductBundle
      parameters:
        - name: bundleId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Bundle retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBundle'
        '404':
          description: Bundle not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /validate:
    post:
      tags: [Product Offerings]
      summary: Validate product configuration
      operationId: validateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductValidationResult'

components:
  schemas:
    ProductOffering:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, RETIRED]
        serviceType:
          type: string
        category:
          $ref: '#/components/schemas/CategoryRef'
        productSpecifications:
          type: array
          items:
            $ref: '#/components/schemas/ProductSpecificationRef'
        productOfferingPrices:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferingPrice'
        productOfferingTerms:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferingTerm'
        bundles:
          type: array
          items:
            $ref: '#/components/schemas/ProductBundleRef'
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristic'
        lifecycleStatus:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: string
      required:
        - id
        - name
        - status
        - serviceType
        - createdAt

    ProductOfferingCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        serviceType:
          type: string
        categoryId:
          type: string
        productSpecificationIds:
          type: array
          items:
            type: string
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristicCreate'
        prices:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferingPriceCreate'
      required:
        - name
        - serviceType

    ProductOfferingUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, DRAFT, RETIRED]
        categoryId:
          type: string
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristicCreate'

    ProductOfferingList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductOffering'
        total:
          type: integer
        page:
          type: integer
        size:
          type: integer

    ProductOfferingPrice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        priceType:
          type: string
          enum: [ONE_TIME, RECURRING, USAGE]
        price:
          type: number
        currency:
          type: string
        unitOfMeasure:
          type: string
        taxIncluded:
          type: boolean
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        pricingLogicAlgorithm:
          type: string

    ProductOfferingPriceCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceType:
          type: string
          enum: [ONE_TIME, RECURRING, USAGE]
        price:
          type: number
        currency:
          type: string
        unitOfMeasure:
          type: string
        taxIncluded:
          type: boolean
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
      required:
        - name
        - priceType
        - price
        - currency

    ProductOfferingPriceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferingPrice'

    ProductOfferingTerm:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        duration:
          $ref: '#/components/schemas/TimePeriod'
        earlyTerminationFee:
          type: number
        autoRenewal:
          type: boolean

    ProductCharacteristic:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM, DATE]
        value:
          type: string
        unitOfMeasure:
          type: string
        minValue:
          type: number
        maxValue:
          type: number
        allowedValues:
          type: array
          items:
            type: string

    ProductCharacteristicCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        valueType:
          type: string
          enum: [STRING, NUMBER, BOOLEAN, ENUM, DATE]
        value:
          type: string
        unitOfMeasure:
          type: string
        minValue:
          type: number
        maxValue:
          type: number
        allowedValues:
          type: array
          items:
            type: string
      required:
        - name
        - valueType

    ProductCharacteristicList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristic'

    ProductSpecification:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        brand:
          type: string
        productNumber:
          type: string
        lifecycleStatus:
          type: string
        validFor:
          $ref: '#/components/schemas/TimePeriod'
        productSpecCharacteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristic'

    ProductSpecificationRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        version:
          type: string

    ProductCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
        level:
          type: integer
        path:
          type: string
        productCount:
          type: integer
        children:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'

    ProductCategoryCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        parentId:
          type: string
      required:
        - name

    ProductCategoryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductCategory'

    CategoryRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ProductBundle:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        bundleType:
          type: string
          enum: [FIXED_MOBILE, INTERNET_VOICE, ENTERPRISE, CUSTOM]
        productOfferings:
          type: array
          items:
            $ref: '#/components/schemas/ProductOfferingRef'
        bundlePrice:
          $ref: '#/components/schemas/BundlePrice'
        discountRules:
          type: array
          items:
            $ref: '#/components/schemas/DiscountRule'
        validFor:
          $ref: '#/components/schemas/TimePeriod'

    ProductBundleCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        bundleType:
          type: string
          enum: [FIXED_MOBILE, INTERNET_VOICE, ENTERPRISE, CUSTOM]
        productOfferingIds:
          type: array
          items:
            type: string
        bundlePrice:
          $ref: '#/components/schemas/BundlePriceCreate'
        discountRules:
          type: array
          items:
            $ref: '#/components/schemas/DiscountRuleCreate'
      required:
        - name
        - bundleType
        - productOfferingIds

    ProductBundleList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductBundle'

    ProductBundleRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    ProductOfferingRef:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        quantity:
          type: integer
        isMandatory:
          type: boolean

    BundlePrice:
      type: object
      properties:
        amount:
          type: number
        currency:
          type: string
        discountPercent:
          type: number
        individualTotal:
          type: number
        savings:
          type: number

    BundlePriceCreate:
      type: object
      properties:
        discountPercent:
          type: number
      required:
        - discountPercent

    DiscountRule:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [PERCENTAGE, FIXED, TIERED]
        value:
          type: number
        condition:
          type: string

    DiscountRuleCreate:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [PERCENTAGE, FIXED, TIERED]
        value:
          type: number
        condition:
          type: string
      required:
        - name
        - type
        - value

    TimePeriod:
      type: object
      properties:
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time

    ProductValidationRequest:
      type: object
      properties:
        productOfferingId:
          type: string
        characteristics:
          type: array
          items:
            $ref: '#/components/schemas/ProductCharacteristicCreate'
        serviceType:
          type: string

    ProductValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
